<main>
  <section class="page-head container">
    <h1 class="page-title" data-zh="为可靠而设计" data-en="Designed for reliability"></h1>
    <p class="page-lead" data-zh="同步是数据的命脉。七条机制层层设防，让每一次同步都经得起中断与异常。" data-en="Sync is where data lives or dies. Seven mechanisms guard every batch against interruption and failure."></p>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="mech-list">
        <div class="mech">
          <span class="mech-tag">two-phase-write</span>
          <div><div class="mech-name" data-zh="两阶段写入" data-en="Two-phase write"></div><div class="mech-desc" data-zh="先写快照，再原子覆盖正式文件——覆盖中途断电也不损坏数据。" data-en="Snapshot first, then atomic replace — a power cut mid-write cannot corrupt the file."></div></div>
        </div>
        <div class="mech">
          <span class="mech-tag">idempotent-batch</span>
          <div><div class="mech-name" data-zh="批 ID 幂等" data-en="Idempotent batch ID"></div><div class="mech-desc" data-zh="同一批数据重复提交直接返回成功，绝不重复写入。" data-en="Resubmitting the same batch returns success without writing twice."></div></div>
        </div>
        <div class="mech">
          <span class="mech-tag">crash-recovery</span>
          <div><div class="mech-name" data-zh="启动自动恢复" data-en="Crash recovery"></div><div class="mech-desc" data-zh="电脑端启动时扫描「覆盖中」批次，自动完成收尾。" data-en="On startup the desktop scans mid-write batches and finishes them."></div></div>
        </div>
        <div class="mech">
          <span class="mech-tag">state-machine</span>
          <div><div class="mech-name" data-zh="防丢失状态机" data-en="Loss-proof state machine"></div><div class="mech-desc" data-zh="Pending → Syncing → Synced，30 秒无确认自动回退待同步。" data-en="Pending → Syncing → Synced; no ack in 30 s and the batch rolls back to pending."></div></div>
        </div>
        <div class="mech">
          <span class="mech-tag">global-lock</span>
          <div><div class="mech-name" data-zh="同步互斥锁" data-en="Global sync lock"></div><div class="mech-desc" data-zh="全局锁保证同一时刻只有一批数据在同步。" data-en="A global lock keeps exactly one batch in flight at any moment."></div></div>
        </div>
        <div class="mech">
          <span class="mech-tag">tamper-detect</span>
          <div><div class="mech-name" data-zh="篡改检测" data-en="Tamper detection"></div><div class="mech-desc" data-zh="启动与聚焦时对比文件时间戳，发现外部改动可一键修复。" data-en="File timestamps are checked on startup and focus; external edits can be repaired in one click."></div></div>
        </div>
        <div class="mech">
          <span class="mech-tag">api-tests</span>
          <div><div class="mech-name" data-zh="接口测试" data-en="API tests"></div><div class="mech-desc" data-zh="推送、拉取、二维码接口均有自动化测试脚本验证。" data-en="Submit, fetch and QR endpoints are covered by automated test scripts."></div></div>
        </div>
      </div>

      <div class="flow-wrap">
        <svg viewBox="0 0 900 240" role="img" aria-label="just-did sync data flow">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0L10 5L0 10z" fill="var(--muted)"/>
            </marker>
          </defs>

          <rect x="20" y="55" width="180" height="120" rx="10" fill="var(--surface)" stroke="var(--line)"/>
          <text x="36" y="82" font-family="var(--font-body)" font-size="14" font-weight="600" fill="var(--fg)">手机端 · App</text>
          <text x="36" y="106" font-family="var(--font-mono)" font-size="12" fill="var(--muted)">staging/ 随手暂存</text>
          <text x="36" y="126" font-family="var(--font-mono)" font-size="12" fill="var(--muted)">Pending → Syncing</text>
          <text x="36" y="146" font-family="var(--font-mono)" font-size="12" fill="var(--muted)">30s 无确认自动回退</text>

          <rect x="360" y="55" width="180" height="120" rx="10" fill="var(--surface)" stroke="var(--line)"/>
          <text x="376" y="82" font-family="var(--font-body)" font-size="14" font-weight="600" fill="var(--fg)">电脑端 · Desktop</text>
          <text x="376" y="106" font-family="var(--font-mono)" font-size="12" fill="var(--muted)">HTTP 服务 :18080</text>
          <text x="376" y="126" font-family="var(--font-mono)" font-size="12" fill="var(--muted)">局域网二维码</text>
          <text x="376" y="146" font-family="var(--font-mono)" font-size="12" fill="var(--muted)">全局同步互斥锁</text>

          <rect x="700" y="55" width="180" height="120" rx="10" fill="var(--code-bg)" stroke="var(--line)"/>
          <text x="716" y="82" font-family="var(--font-body)" font-size="14" font-weight="600" fill="var(--fg)">日报文件</text>
          <text x="716" y="106" font-family="var(--font-mono)" font-size="12" fill="var(--brand)">data/2026/08/16.txt</text>
          <text x="716" y="126" font-family="var(--font-mono)" font-size="12" fill="var(--muted)">纯文本 · 任何编辑器</text>
          <text x="716" y="146" font-family="var(--font-mono)" font-size="12" fill="var(--muted)">可直接打开</text>

          <line x1="200" y1="88" x2="360" y2="88" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
          <text x="280" y="74" text-anchor="middle" font-family="var(--font-body)" font-size="12" fill="var(--fg)">扫码配对 · 一键推送 ZIP + 批ID</text>
          <text x="280" y="104" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--brand)">idempotent · lock · ack</text>

          <line x1="360" y1="142" x2="200" y2="142" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
          <text x="280" y="162" text-anchor="middle" font-family="var(--font-body)" font-size="12" fill="var(--fg)">拉取日报 · 日历多选</text>

          <line x1="540" y1="115" x2="700" y2="115" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
          <text x="620" y="102" text-anchor="middle" font-family="var(--font-body)" font-size="12" fill="var(--fg)">两阶段写入</text>
          <text x="620" y="134" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--brand)">snapshot → rename</text>
        </svg>
        <p class="flow-caption" data-zh="扫码配对后，手机推送的每一批数据都经过幂等校验与两阶段写入，才落成纯文本日报；拉取方向同样受互斥锁保护。" data-en="After scan-to-connect, every batch pushed from the phone passes idempotency checks and a two-phase write before it lands as a plain-text daily log; fetches are protected by the same global lock."></p>
      </div>
    </div>
  </section>
